name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html www/ 2>/dev/null || true
          cp -r * www/ 2>/dev/null || true
          rm -rf www/www www/node_modules www/.github www/android

      - name: Install Dependencies & Assets Tool
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Download Wallet Icon
        run: |
          curl -s -L -o icon.png "https://cdn-icons-png.flaticon.com/512/5501/5501375.png"

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Generate App Icons
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor '#060910'
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahfazti-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
