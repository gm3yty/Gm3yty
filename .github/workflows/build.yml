name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Set Working Directory
        id: find-dir
        run: |
          # البحث التلقائي عن مسار ملف package.json وتخزينه
          PKG_PATH=$(find . -name "package.json" -maxdepth 3 | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found anywhere!"
            exit 1
          fi
          DIR_PATH=$(dirname "$PKG_PATH")
          echo "Found project at: $DIR_PATH"
          echo "dir=$DIR_PATH" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ${{ steps.find-dir.outputs.dir }}
        run: npm install

      - name: Build Web App & Capacitor Sync
        working-directory: ${{ steps.find-dir.outputs.dir }}
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build Release APK with Gradle
        working-directory: ${{ steps.find-dir.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.find-dir.outputs.dir }}/android/app/build/outputs/apk/release/app-release.apk
          
