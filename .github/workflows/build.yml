name: Build Multiplatform App
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Android Environment
        uses: android-actions/setup-android@v2

      - name: Prepare Android Project
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "المنظومة المالية" com.finance.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug-apk.debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Prepare iOS Project
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "المنظومة المالية" com.finance.app --web-dir www
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Output
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: ios/App/build/Build/Products/Release-iphoneos/
